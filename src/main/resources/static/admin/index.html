<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LTO Reviewer Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <section id="loginView" class="login-wrap" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand brand-dark">
        <span class="brand-mark">LTO</span>
        <div>
          <div class="brand-title">LTO Reviewer</div>
          <div class="brand-sub">Admin Panel</div>
        </div>
      </div>
      <h1>Sign in</h1>
      <label>Email
        <input id="loginEmail" type="email" required autocomplete="username" placeholder="admin@lto.local">
      </label>
      <label>Password
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </section>

  <!-- ===================== APP ===================== -->
  <div id="appView" class="layout" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">LTO</span>
        <div>
          <div class="brand-title">LTO Reviewer</div>
          <div class="brand-sub">Admin Panel</div>
        </div>
      </div>
      <nav id="nav">
        <a href="#dashboard" data-view="dashboard">Dashboard</a>
        <a href="#questions" data-view="questions">Questions</a>
        <a href="#road-signs" data-view="road-signs">Road Signs</a>
        <a href="#violations" data-view="violations">Fines &amp; Penalties</a>
        <a href="#users" data-view="users">Users</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-right">
          <span id="adminName" class="admin-name"></span>
          <button id="logoutBtn" class="btn btn-ghost">Log out</button>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- Shared pop-up used for every Add / Edit form -->
  <dialog id="modal">
    <form id="modalForm" method="dialog">
      <header class="modal-head">
        <h3 id="modalTitle"></h3>
        <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <p id="modalError" class="form-error" hidden></p>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="modalSave">Save</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
