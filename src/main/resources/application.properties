spring.application.name=api

server.port=8080

# Passwords and secrets live in secrets.properties (next to pom.xml, NOT pushed to GitHub)
spring.config.import=optional:file:./secrets.properties

# ---- MySQL (XAMPP) ----
spring.datasource.url=jdbc:mysql://localhost:3307/lto_reviewer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=lto_api

# The tables already exist (setup_all.sql), so Hibernate must NOT create or change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Login tokens (JWT) ----
app.jwt.expiration-hours=168

# ---- First admin account (created automatically if tbl_admins is empty) ----
app.admin.full-name=LTO Admin
app.admin.email=admin@lto.local